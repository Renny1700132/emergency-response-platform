version: '1.0'
name: g4-quality-gates
displayName: G4工程质量门禁
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - codex/
      include:
        - master
stages:
  - stage:
    name: quality
    displayName: 覆盖率-契约-安全-自查
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: quality_gates
        displayName: G4质量门禁
        nodeVersion: 20.19.0
        commands:
          - node --version
          - npm --version
          - npm ci
          - npm run quality
        caches:
          - ~/.npm
        notify: []
        strategy:
          retry: '0'
