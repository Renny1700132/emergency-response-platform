services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emergency
      POSTGRES_USER: emergency
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in the private deployment environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency -d emergency"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - emergency-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://emergency:${POSTGRES_PASSWORD:?set in the private deployment environment}@database:5432/emergency
      MIDDLE_PLATFORM_BASE_URL: ${MIDDLE_PLATFORM_BASE_URL:?set to the owner-provided middle-platform endpoint}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  emergency-postgres:
