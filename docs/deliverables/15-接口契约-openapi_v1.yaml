components:
  securitySchemes:
    middlePlatformBearer:
      type: http
      scheme: bearer
      bearerFormat: 由统一中台签发；格式待接口资料确认
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 调用链请求标识
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 写操作幂等键；同键异载荷返回 409
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  schemas:
    ApiResponse:
      type: object
      required:
      - code
      - message
      - traceId
      - timestamp
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          nullable: true
        traceId:
          type: string
          example: trace-demo-001
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - traceId
      - timestamp
      properties:
        code:
          type: string
          example: RULE-422
        message:
          type: string
          example: 状态不允许执行该操作
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
    FieldError:
      type: object
      properties:
        path:
          type: string
        reason:
          type: string
    PageResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            required:
            - items
            - page
            - size
            - total
            properties:
              items:
                type: array
                items:
                  type: object
                  additionalProperties: true
              page:
                type: integer
              size:
                type: integer
              total:
                type: integer
                format: int64
    CommandRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        resourceVersion:
          type: integer
          format: int64
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        sourceGeneratedAt:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties: true
    CreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        typeCode:
          type: string
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
        sourceGeneratedAt:
          type: string
          format: date-time
        coordinateReference:
          type: string
          description: 真实坐标系待甲方地图资料确认
        floorCode:
          type: string
        attachmentFileIds:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
    ExternalAlert:
      type: object
      required:
      - sourceSystem
      - externalAlertId
      - alertType
      - occurredAt
      - payloadVersion
      properties:
        sourceSystem:
          type: string
          enum:
          - INFORMATION_PUBLISH
          - INTRUSION
          - FIRE
          - IOT
          - OTHER
        externalAlertId:
          type: string
          description: 源系统可靠唯一 ID；缺失时不得自动合并
        alertType:
          type: string
        occurredAt:
          type: string
          format: date-time
        sourceGeneratedAt:
          type: string
          format: date-time
        payloadVersion:
          type: string
        normalizedPayload:
          type: object
          additionalProperties: true
    MessageReceipt:
      type: object
      required:
      - platformMessageId
      - status
      - sourceGeneratedAt
      properties:
        platformMessageId:
          type: string
        attemptNo:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - ACCEPTED
          - DELIVERED
          - FAILED
          - UNKNOWN
        sourceGeneratedAt:
          type: string
          format: date-time
        errorCode:
          type: string
        errorSummary:
          type: string
      x-external-schema-status: PENDING_EXTERNAL_EVIDENCE
    VideoQuery:
      type: object
      required:
      - cameraRef
      - mode
      properties:
        cameraRef:
          type: string
        mode:
          type: string
          enum:
          - LIVE
          - PLAYBACK
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
      x-external-schema-status: PENDING_EXTERNAL_EVIDENCE
    AccessControlCommand:
      type: object
      required:
      - doorRef
      - action
      - confirmationToken
      - reason
      properties:
        doorRef:
          type: string
        action:
          type: string
          enum:
          - REQUEST_OPEN
        confirmationToken:
          type: string
          minLength: 16
        reason:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
    PlanRequest:
      type: object
      required:
      - name
      - planTypeCode
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        planTypeCode:
          type: string
          maxLength: 64
        applicableConditions:
          type: array
          items:
            type: string
        description:
          type: string
          maxLength: 2000
    PlanVersionRequest:
      type: object
      required:
      - versionLabel
      - nodes
      - taskTemplates
      properties:
        versionLabel:
          type: string
          maxLength: 40
        nodes:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - nodeKey
            - name
            properties:
              nodeKey:
                type: string
              name:
                type: string
              dependsOn:
                type: array
                items:
                  type: string
        taskTemplates:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - templateKey
            - name
            - responsibleRole
            properties:
              templateKey:
                type: string
              name:
                type: string
              responsibleRole:
                type: string
              deadlineMinutes:
                type: integer
                minimum: 1
        verificationConfigId:
          type: string
    IncidentCreateRequest:
      type: object
      required:
      - incidentTypeCode
      - title
      - occurredAt
      - description
      properties:
        incidentTypeCode:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        occurredAt:
          type: string
          format: date-time
        sourceGeneratedAt:
          type: string
          format: date-time
        sourceSystem:
          type: string
        externalAlertId:
          type: string
        location:
          $ref: '#/components/schemas/SpatialReference'
        attachmentFileIds:
          type: array
          items:
            type: string
    IncidentUpdateRequest:
      type: object
      required:
      - content
      - occurredAt
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
        occurredAt:
          type: string
          format: date-time
        sourceGeneratedAt:
          type: string
          format: date-time
        attachmentFileIds:
          type: array
          items:
            type: string
    VerifyIncidentRequest:
      type: object
      required:
      - decision
      - reason
      - resourceVersion
      properties:
        decision:
          type: string
          enum:
          - CONFIRMED
          - REJECTED
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        resourceVersion:
          type: integer
          format: int64
          minimum: 0
    StartResponseRequest:
      type: object
      required:
      - planVersionId
      - resourceVersion
      properties:
        planVersionId:
          type: string
        resourceVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 1000
    TaskRequest:
      type: object
      required:
      - name
      - assigneeRef
      - deadlineAt
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        assigneeRef:
          type: string
        deadlineAt:
          type: string
          format: date-time
        description:
          type: string
          maxLength: 3000
    TaskFeedbackRequest:
      type: object
      required:
      - content
      - resourceVersion
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 3000
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        attachmentFileIds:
          type: array
          items:
            type: string
        resourceVersion:
          type: integer
          format: int64
          minimum: 0
    TaskReassignRequest:
      type: object
      required:
      - newAssigneeRef
      - reason
      - resourceVersion
      properties:
        newAssigneeRef:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        newDeadlineAt:
          type: string
          format: date-time
          description: 缺省时保持原截止时间；变更须具备授权并审计
        resourceVersion:
          type: integer
          format: int64
          minimum: 0
    SpatialReference:
      type: object
      properties:
        coordinateReference:
          type: string
          description: 真实坐标系待甲方资料确认
        floorCode:
          type: string
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        sourceAccuracyMeters:
          type: number
          format: double
          minimum: 0
        sourceGeneratedAt:
          type: string
          format: date-time
    MaterialLedgerRequest:
      type: object
      required:
      - siteId
      - materialCode
      - quantity
      - unit
      - resourceVersion
      properties:
        siteId:
          type: string
        materialCode:
          type: string
        quantity:
          type: number
          format: double
          minimum: 0
        unit:
          type: string
        expiresAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
          minimum: 0
    InventoryPlanRequest:
      type: object
      required:
      - name
      - siteIds
      properties:
        name:
          type: string
          minLength: 1
        siteIds:
          type: array
          minItems: 1
          items:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    InventoryRecordRequest:
      type: object
      required:
      - snapshotItemId
      - actualQuantity
      properties:
        snapshotItemId:
          type: string
        actualQuantity:
          type: number
          format: double
          minimum: 0
        attachmentFileIds:
          type: array
          items:
            type: string
        remark:
          type: string
          maxLength: 1000
    InventoryReviewRequest:
      type: object
      required:
      - decision
      - reason
      - resourceVersion
      properties:
        decision:
          type: string
          enum:
          - APPROVE_ADJUSTMENT
          - REJECT
        reason:
          type: string
          minLength: 1
        resourceVersion:
          type: integer
          format: int64
          minimum: 0
    DrillPlanRequest:
      type: object
      required:
      - name
      - plannedAt
      - frequencyRule
      properties:
        name:
          type: string
          minLength: 1
        plannedAt:
          type: string
          format: date-time
        frequencyRule:
          type: string
        responsibleGroupId:
          type: string
        relatedOriginalPlanId:
          type: string
          description: 补演时关联原计划
    DrillExecutionRequest:
      type: object
      required:
      - actualStartAt
      - actualEndAt
      - result
      properties:
        actualStartAt:
          type: string
          format: date-time
        actualEndAt:
          type: string
          format: date-time
        result:
          type: string
          enum:
          - COMPLETED
          - CANCELLED
          - INCOMPLETE
        attachmentFileIds:
          type: array
          items:
            type: string
        reason:
          type: string
    AttendanceCheckInRequest:
      type: object
      required:
      - taskId
      - checkPointId
      - qrToken
      - position
      properties:
        taskId:
          type: string
        checkPointId:
          type: string
        qrToken:
          type: string
          minLength: 16
        position:
          $ref: '#/components/schemas/SpatialReference'
        clientRecordedAt:
          type: string
          format: date-time
    FilePresignRequest:
      type: object
      required:
      - fileName
      - contentType
      - size
      properties:
        fileName:
          type: string
          minLength: 1
        contentType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
    VerificationConfigRequest:
      type: object
      required:
      - name
      - steps
      properties:
        name:
          type: string
          minLength: 1
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - stepKey
            - handlerRole
            - timeoutMinutes
            properties:
              stepKey:
                type: string
              handlerRole:
                type: string
              fallbackRole:
                type: string
              timeoutMinutes:
                type: integer
                minimum: 1
    Entity:
      type: object
      required:
      - id
      - status
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        status:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties: true
    EntityResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Entity'
