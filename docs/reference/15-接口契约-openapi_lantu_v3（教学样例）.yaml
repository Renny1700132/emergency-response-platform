# ----------------------------------------------------------------
# 文档编号：LTPT-2026-G3-15（教学样例 · “澜图”遥感影像智能解译与地物提取平台建设项目）
# 修订记录：
#   V1.0 | 2026-08-19 | 全部 | 首版，随设计冻结发布（D8） | 乙
#   V2.0 | 2026-08-20 | paths | 重锚：端点收缩为真实 6 个；与接口设计说明书 V2.0 一致（D9） | 乙
#   V3.0 | 2026-08-27 | components | 阈值参数校验分支对齐变更单 CR-001（D14） | 乙
# ----------------------------------------------------------------
openapi: 3.0.3

# 澜图遥感影像智能解译工具集 —— REST 接口契约
# 教学样例 · 契约快照 v3 · 与 spec.md V3.0 / RTM v3 同源
#
# 纪律（constitution.md R-16）：修改接口的顺序永远是
#   改本契约 → 契约测试转红 → 改实现转绿
# 不允许实现先行、契约后补。本文件由 FastAPI 的 /openapi.json 导出后人工补充
# 说明与示例，字段名与实现逐一对齐，漂移即由契约测试拦截（CT-001~CT-004）。

info:
  title: 澜图遥感影像智能解译工具集 API
  version: 3.0.0
  description: |
    基于开源 segment-geospatial（samgeo，MIT）的行业化二次开发，提供 SAM 系列模型的
    遥感影像分割能力。共 6 个端点：3 个管理端点 + 3 个分割端点。

    **调用方**：QGIS 插件（交互式）、冒烟与验收脚本。

    **执行模型**：同步阻塞 + 模型实例缓存（见 ADR-002、ADR-003）。分割为长耗时操作，
    客户端须设置足够超时：交互分割建议 30 s，全自动分割建议 900 s，文本提示建议 600 s。

    **批量场景**：不走本接口，走 CLI（`cli-anything-samgeo segment ...`）。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: 本地开发与教学环境

tags:
  - name: 管理
    description: 服务健康与模型缓存管理（FR-07.1★）
  - name: 分割
    description: 三类分割能力（FR-04.1★ / FR-04.2★ / FR-04.3 / FR-04.4★，经 FR-07.2★ 暴露）

paths:
  /health:
    get:
      tags: [管理]
      summary: 服务健康检查
      description: 用于容器健康探针与部署冒烟。不加载模型，响应恒为毫秒级。
      operationId: health
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 3.0.0
      x-requirement: FR-07.1
      x-acceptance: AC-FR-07.1-a
      x-test: tests/test_api.py::test_health

  /models:
    get:
      tags: [管理]
      summary: 查询可用模型清单
      description: |
        返回模型注册表内容。清单集中在 `samgeo/model_registry.py` 维护，
        新增变体不需要改调用方代码（FR-03.1★）。
      operationId: listModels
      responses:
        '200':
          description: 模型清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  available_models:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
                    example:
                      sam: [vit_h, vit_l, vit_b]
                      sam2: [sam2-hiera-tiny, sam2-hiera-small, sam2-hiera-base-plus, sam2-hiera-large]
                      sam3: [facebook/sam3, facebook/sam3.1]
                  default_model_ids:
                    type: object
                    additionalProperties: { type: string }
                    example:
                      sam: vit_h
                      sam2: sam2-hiera-large
                      sam3: facebook/sam3
      x-requirement: FR-03.1, FR-07.1
      x-acceptance: AC-FR-03.1-a, AC-FR-07.1-b
      x-test: tests/test_api.py::test_list_models

    delete:
      tags: [管理]
      summary: 清空模型缓存
      description: |
        主动释放已加载模型占用的显存。缓存策略见 ADR-003：缓存键为
        「模型版本 + 模型 ID + 冻结后的构造参数」，不同配置分别缓存互不覆盖。
        清空后下次请求会重新加载（冷启动，耗时不计入 PE-01）。
      operationId: clearModels
      responses:
        '200':
          description: 缓存已清空
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared: { type: integer, example: 2 }
      x-requirement: FR-07.1
      x-acceptance: AC-FR-07.1-c
      x-test: tests/test_api.py::test_clear_models

  /segment/automatic:
    post:
      tags: [分割]
      summary: 全自动分割
      description: |
        对整幅影像自动生成全部目标掩膜，无需任何提示。粒度由采样密度与阈值参数控制。
        典型耗时分钟级，PE-02 要求 1 km²（约 2048²）≤10 min（GPU）。
      operationId: segmentAutomatic
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 影像文件（TIFF / PNG / JPEG）。类型与大小校验见 SEC-01★。
                model_version:
                  type: string
                  enum: [sam, sam2, sam3]
                  default: sam3
                model_id:
                  type: string
                  nullable: true
                  description: 具体模型变体，缺省时取该版本的默认变体。
                output_format:
                  type: string
                  enum: [geojson, geotiff, png]
                  default: geojson
                foreground:
                  type: boolean
                  default: true
                  description: 是否只提取前景目标。
                unique:
                  type: boolean
                  default: true
                  description: 是否为每个目标分配唯一标识。
                min_size:
                  type: integer
                  default: 0
                  description: 最小掩膜像素数，用于剔除碎屑。
                max_size:
                  type: integer
                  nullable: true
                  description: 最大掩膜像素数。
                points_per_side:
                  type: integer
                  default: 32
                  description: 每边采样点数（SAM / SAM2）。调低会减少输出图斑数（AC-FR-04.1-b）。
                pred_iou_thresh:
                  type: number
                  format: float
                  default: 0.8
                stability_score_thresh:
                  type: number
                  format: float
                  default: 0.95
      responses:
        '200':
          description: 分割结果
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/FeatureCollection' }
            image/png:
              schema: { type: string, format: binary }
            image/tiff:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-requirement: FR-04.1, FR-07.2
      x-acceptance: AC-FR-04.1-a, AC-FR-04.1-b, AC-FR-07.2-a, AC-FR-07.2-c
      x-test: >-
        tests/test_api.py::test_automatic_png_response,
        test_automatic_missing_file, test_automatic_invalid_model_version,
        test_automatic_invalid_model_id, test_invalid_output_format

  /segment/predict:
    post:
      tags: [分割]
      summary: 提示分割（点 / 框）
      description: |
        接受点提示或框提示。点提示用 `point_coords` 配 `point_labels`（1 前景、0 背景），
        追加背景点可将该点邻域从前景转为背景（AC-FR-04.2-b）。
        **至少提供 `point_coords` 或 `boxes` 之一**，都不提供返回 400（AC-FR-04.2-c）。

        注意 SAM3 的语义差异：框提示会查找影像中所有相似目标，而非仅框内目标。
      operationId: segmentPredict
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                model_version:
                  type: string
                  enum: [sam, sam2, sam3]
                  default: sam3
                model_id:
                  type: string
                  nullable: true
                output_format:
                  type: string
                  enum: [geojson, geotiff, png]
                  default: geojson
                point_coords:
                  type: string
                  nullable: true
                  description: JSON 数组字符串，形如 `[[x1,y1],[x2,y2]]`。
                  example: '[[512, 384], [530, 400]]'
                point_labels:
                  type: string
                  nullable: true
                  description: JSON 数组字符串，1 为前景点、0 为背景点，长度须与 point_coords 一致。
                  example: '[1, 0]'
                boxes:
                  type: string
                  nullable: true
                  description: JSON 数组字符串，形如 `[[xmin,ymin,xmax,ymax]]`。
                  example: '[[100, 100, 400, 380]]'
                point_crs:
                  type: string
                  nullable: true
                  description: 提示坐标的参考系；给定时按地理坐标解释，缺省按图像像素坐标。
                  example: EPSG:4326
                multimask_output:
                  type: boolean
                  default: false
                min_size:
                  type: integer
                  default: 0
                max_size:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: 分割结果
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/FeatureCollection' }
            image/png:
              schema: { type: string, format: binary }
            image/tiff:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-requirement: FR-04.2, FR-04.3, FR-07.2
      x-acceptance: AC-FR-04.2-a, AC-FR-04.2-b, AC-FR-04.2-c, AC-FR-04.3-a, AC-FR-04.3-b
      x-test: >-
        tests/test_api.py::test_predict_missing_prompts,
        test_predict_sam3_points_accepted
      x-performance: PE-01（≤3 s，GPU，1024² 窗口，模型缓存命中）

  /segment/text:
    post:
      tags: [分割]
      summary: 文本提示分割
      description: |
        以自然语言类别描述驱动「检测 + 分割」两级链路，输出携带置信度分数。
        影像中不存在该类别时返回空结果集，不报错（AC-FR-04.4-c）。

        `output_format` 取 `detections` 返回检测框多边形的 GeoJSON（地理坐标，含分数），
        取 `json` 返回像素坐标下的检测框数组。
      operationId: segmentText
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, prompt]
              properties:
                file:
                  type: string
                  format: binary
                prompt:
                  type: string
                  description: 目标类别的自然语言描述。
                  example: building
                model_id:
                  type: string
                  nullable: true
                backend:
                  type: string
                  enum: [meta, transformers]
                  default: meta
                output_format:
                  type: string
                  enum: [geojson, geotiff, png, detections, json]
                  default: geojson
                confidence_threshold:
                  type: number
                  format: float
                  default: 0.5
                  description: |
                    REST 层置信度阈值，保持 0.5 以兼容既有调用方。
                    CLI 与 core 层的 box / text 阈值默认经 CR-001 由 0.30 调整为 0.24，
                    用于提升低对比度地物召回。两处口径差异是有意为之，已在部署手册中说明。
                min_size:
                  type: integer
                  default: 0
                max_size:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: 分割结果；GeoJSON 形态下每个 Feature 的属性含置信度分数
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/FeatureCollection' }
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bbox:
                      type: array
                      items: { type: number }
                      minItems: 4
                      maxItems: 4
                    score: { type: number, format: float }
            image/png:
              schema: { type: string, format: binary }
            image/tiff:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-requirement: FR-04.4, FR-07.2
      x-acceptance: AC-FR-04.4-a, AC-FR-04.4-b, AC-FR-04.4-c
      x-test: tests/test_api.py::test_text_geojson_includes_scores

components:
  schemas:
    FeatureCollection:
      type: object
      description: GeoJSON 要素集合。坐标参考系与源影像一致。
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items: { $ref: '#/components/schemas/Feature' }

    Feature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          type: object
          description: Polygon 或 MultiPolygon
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon]
            coordinates:
              type: array
              items: {}
        properties:
          type: object
          properties:
            id:
              type: integer
              description: 目标唯一标识（`unique=true` 时分配）
            score:
              type: number
              format: float
              description: 置信度分数（文本提示分割时提供）
            area:
              type: number
              format: float
              description: 图斑面积

    Error:
      type: object
      description: |
        统一错误结构。HTTP 状态码只用标准语义，业务错误码放在 `code` 字段
        （constitution.md R-05）。
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_MODEL_VERSION
        message:
          type: string
          description: 含操作名、输入标识与失败原因（constitution.md R-04）
          example: "segment_automatic: 不支持的模型版本 'sam4'，受支持版本为 sam / sam2 / sam3"
        detail:
          type: object
          nullable: true

  responses:
    BadRequest:
      description: 参数非法（模型版本、模型 ID、输出格式、提示缺失等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 上传文件超出大小限制（SEC-01★）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: 请求体结构校验失败（FastAPI 自动校验）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

# ---------------------------------------------------------------------------
# 契约测试挂接（CT-001~CT-004，见 RTM v4）
#   CT-001  /health 与 /models 的响应结构与本契约一致
#   CT-002  模型清单与 samgeo/model_registry.py 注册表逐项一致
#   CT-003  三个分割端点的表单字段名、默认值、枚举值与实现一致
#   CT-004  /openapi.json 与本快照比对，任一字段漂移即失败
#
# 验证方式：CI 中启动服务，抓取 /openapi.json 与本文件做结构化比对。
# 手工改任一响应字段名，契约测试必须立即转红（AC-FR-07.3-a）。
# ---------------------------------------------------------------------------
